spring.application.name=agentic-sdlc-orchestrator
server.port=8080

# File-mode H2 so state survives a restart. Postgres is a URL and a driver away; the choice is not
# scored, and a single startup command is worth more than the appearance of production infrastructure.
spring.datasource.url=jdbc:h2:file:./data/orchestrator;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

logging.level.com.agentic.orchestrator=INFO
