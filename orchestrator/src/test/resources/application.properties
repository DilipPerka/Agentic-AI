# A distinct in-memory database per Spring context, so one test class cannot see another's rows.
# A fixed name would be shared across contexts for the life of the JVM and make failures depend on
# test execution order.
spring.datasource.url=jdbc:h2:mem:orchestrator-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

orchestrator.simulation.node-delay-ms=0
